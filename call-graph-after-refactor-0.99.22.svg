<rect class="node" x="70" y="436" width="240" height="34" rx="3"/>
<text class="fn" x="190" y="458">step_fit_ln_likelihoods</text>
<rect class="int" x="70" y="506" width="205" height="34" rx="3"/>
<text class="fni" x="172" y="528">.step_fit_profile</text>
<text class="sub" x="172" y="556">inspection and tests only</text>

<path class="edge" d="M 312 450 L 487 450" marker-end="url(#a)"/>
<path class="edge" d="M 312 464 L 487 518" marker-end="url(#a)"/>
<path class="edge" d="M 277 516 L 487 472" marker-end="url(#a)"/>
<text class="lbl" x="399" y="440">by matrix shape</text>

<!-- ===== legend ===== -->
<line x1="70" y1="626" x2="910" y2="626" stroke="var(--rule)" stroke-width="1"/>

<rect class="node" x="72" y="646" width="26" height="16" rx="2"/>
<text class="lbl" x="110" y="659" style="text-anchor:start">exported — 8 functions</text>

<rect class="int" x="292" y="646" width="26" height="16" rx="2"/>
<text class="lbl" x="330" y="659" style="text-anchor:start">internal, exists today</text>

<rect class="new" x="512" y="646" width="26" height="16" rx="2"/>
<text class="lbl" x="550" y="659" style="text-anchor:start">internal, created by this refactoring</text>

<text class="sub" x="490" y="688">Four helpers are new. Every exported function keeps the behaviour it has today.</text>
